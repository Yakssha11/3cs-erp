<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 3C's ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#081C2C] flex items-center justify-center min-h-screen">
    <div class="bg-[#0B1E2D] p-8 rounded-xl w-full max-w-sm border border-[#1E3A50]">
        <div class="text-center mb-6">
            <div class="text-6xl mb-3">🐔</div>
            <h1 class="text-2xl font-bold text-white">3C's ERP</h1>
            <p class="text-[#6A8FAD] text-xs mt-1">Stock Management System</p>
        </div>

        {% if form.errors %}
        <div class="bg-red-900/30 text-red-400 border border-red-800 rounded px-4 py-2 text-sm mb-4">
            Invalid username or password
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="text-xs text-[#6A8FAD] font-bold uppercase tracking-wider block mb-1">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full bg-[#0D2538] border border-[#1E3A50] rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-[#1A8FD1]">
            </div>
            <div class="mb-6">
                <label class="text-xs text-[#6A8FAD] font-bold uppercase tracking-wider block mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-[#0D2538] border border-[#1E3A50] rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-[#1A8FD1]">
            </div>
            <button type="submit"
                    class="w-full bg-[#1A8FD1] hover:bg-[#157AB0] text-white font-bold py-3 rounded-lg text-sm transition-all">
                Sign In
            </button>
        </form>
        <p class="text-center text-[#1E3A50] text-xs mt-6">v1.0  ·  3C's ERP System</p>
    </div>
</body>
</html>
