{% extends 'base.html' %}
{% load auth_extras %}

{% block page_title %}Edit Laying Finance{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'laying_finance_list' %}"
           class="text-muted hover:text-white transition-all text-sm">
            ← Back to Laying Finance
        </a>
    </div>

    <div class="bg-sidebar border border-border rounded-xl p-6">
        <h1 class="text-xl font-bold text-white mb-1">✏️ Edit Expense Record</h1>
        <p class="text-muted text-sm mb-6">Update this expense entry</p>

        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4 mb-6">

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Date</label>
                    <input type="date" name="expense_date" value="{{ finance.expense_date }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Nature</label>
                    <select name="nature" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber">
                        <option value="">Select nature</option>
                        {% for category in categories %}
                        <option value="{{ category.name }}" {% if finance.nature == category.name %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Building</label>
                    <select name="building" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber">
                        <option value="">Select building</option>
                        {% for building in buildings %}
                        <option value="{{ building.name }}" {% if finance.building == building.name %}selected{% endif %}>
                            {{ building.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Amount (₱)</label>
                    <input type="number" name="amount" value="{{ finance.amount }}" step="0.01" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Person</label>
                    <input type="text" name="person" value="{{ finance.person }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Remarks</label>
                    <input type="text" name="remarks" value="{{ finance.remarks }}"
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber">
                </div>

            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="bg-[#D4880A] hover:bg-[#B5720A] text-white text-sm font-bold px-6 py-2 rounded-lg transition-all">
                    Update
                </button>
                <a href="{% url 'laying_finance_list' %}"
                   class="bg-content hover:bg-border text-muted text-sm font-bold px-6 py-2 rounded-lg transition-all border border-border">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
