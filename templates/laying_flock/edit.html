{% extends 'base.html' %}
{% load auth_extras %}

{% block page_title %}Edit Laying Flock{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'laying_flock_list' %}"
           class="text-muted hover:text-white transition-all text-sm">
            ← Back to Laying Flock
        </a>
    </div>

    <div class="bg-sidebar border border-border rounded-xl p-6">
        <h1 class="text-xl font-bold text-white mb-1">✏️ Edit Laying Flock</h1>
        <p class="text-muted text-sm mb-6">Update details for {{ flock.batch_name }}</p>

        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4 mb-6">

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Batch Name</label>
                    <input type="text" name="batch_name" value="{{ flock.batch_name }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Building</label>
                    <select name="building" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                        <option value="RTL Building 1" {% if flock.building == 'RTL Building 1' %}selected{% endif %}>RTL Building 1</option>
                        <option value="RTL Building 2" {% if flock.building == 'RTL Building 2' %}selected{% endif %}>RTL Building 2</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Start Count</label>
                    <input type="number" name="start_count" value="{{ flock.start_count }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Current Count</label>
                    <input type="number" name="current_count" value="{{ flock.current_count }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Date Placed</label>
                    <input type="date" name="date_placed" value="{{ flock.date_placed }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Status</label>
                    <select name="status" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                        <option value="Active"      {% if flock.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Transferred" {% if flock.status == 'Transferred' %}selected{% endif %}>Transferred</option>
                        <option value="Sold"        {% if flock.status == 'Sold' %}selected{% endif %}>Sold</option>
                        <option value="Closed"      {% if flock.status == 'Closed' %}selected{% endif %}>Closed</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Supplier</label>
                    <input type="text" name="supplier" value="{{ flock.supplier }}"
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                </div>

                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Notes</label>
                    <input type="text" name="notes" value="{{ flock.notes }}"
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green">
                </div>

            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="bg-[#2ECC71] hover:bg-[#27AE60] text-white text-sm font-bold px-6 py-2 rounded-lg transition-all">
                    Update
                </button>
                <a href="{% url 'laying_flock_list' %}"
                   class="bg-content hover:bg-border text-muted text-sm font-bold px-6 py-2 rounded-lg transition-all border border-border">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
