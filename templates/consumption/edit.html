{% extends 'base.html' %}

{% block page_title %}Edit Consumption Record{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <!-- header -->
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'consumption_list' %}"
           class="text-muted hover:text-white transition-all text-sm">
            ← Back to Consumption
        </a>
    </div>

    <div class="bg-sidebar border border-border rounded-xl p-6">
        <h1 class="text-xl font-bold text-white mb-1">✏️ Edit Consumption Record</h1>
        <p class="text-muted text-sm mb-6">Update the details for this record</p>

        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4 mb-6">

                <!-- growing house -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Growing House</label>
                    <select name="growing_house" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                        <option value="">Select house</option>
                        {% for building in buildings %}
                        <option value="{{ building.name }}" {% if consumption.growing_house == building.name %}selected{% endif %}>
                            {{ building.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- category -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Category</label>
                    <select name="category" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                        <option value="">Select category</option>
                        {% for category in categories %}
                        <option value="{{ category.name }}" {% if consumption.category == category.name %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- item id -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Item ID</label>
                    <input type="text" name="item_id" value="{{ consumption.item_id }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                </div>

                <!-- item name -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Item Name</label>
                    <input type="text" name="item_name" value="{{ consumption.item_name }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                </div>

                <!-- quantity -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Quantity</label>
                    <input type="number" name="quantity" value="{{ consumption.quantity }}" step="0.01" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                </div>

                <!-- unit -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Unit</label>
                    <select name="unit" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                        <option value="">Select unit</option>
                        {% for unit in units %}
                        <option value="{{ unit.name }}" {% if consumption.unit == unit.name %}selected{% endif %}>
                            {{ unit.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- date -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Date</label>
                    <input type="date" name="date_consumed" value="{{ consumption.date_consumed }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                </div>

                <!-- recorded by -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Recorded By</label>
                    <input type="text" name="recorded_by" value="{{ consumption.recorded_by }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                </div>

                <!-- remarks -->
                <div class="col-span-2">
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Remarks</label>
                    <input type="text" name="remarks" value="{{ consumption.remarks }}"
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-teal">
                </div>

            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="bg-[#17A98A] hover:bg-[#129070] text-white text-sm font-bold px-6 py-2 rounded-lg transition-all">
                    Update
                </button>
                <a href="{% url 'consumption_list' %}"
                   class="bg-content hover:bg-border text-muted text-sm font-bold px-6 py-2 rounded-lg transition-all border border-border">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>

{% endblock %}
