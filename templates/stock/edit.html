{% extends 'base.html' %}

{% block page_title %}Edit Stock Item{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <!-- header -->
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'stock_list' %}"
           class="text-muted hover:text-white transition-all text-sm">
            ← Back to Stock
        </a>
    </div>

    <div class="bg-sidebar border border-border rounded-xl p-6">
        <h1 class="text-xl font-bold text-white mb-1">✏️ Edit Stock Item</h1>
        <p class="text-muted text-sm mb-6">Update the details for {{ stock.name }}</p>

        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4 mb-6">

                <!-- item id -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Item ID</label>
                    <input type="text" name="item_id" value="{{ stock.item_id }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                </div>

                <!-- name -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Name</label>
                    <input type="text" name="name" value="{{ stock.name }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                </div>

                <!-- price -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Price (₱)</label>
                    <input type="number" name="price" value="{{ stock.price }}" step="0.01" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                </div>

                <!-- quantity -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Quantity</label>
                    <input type="number" name="quantity" value="{{ stock.quantity }}" required
                           class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                </div>

                <!-- category -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Category</label>
                    <select name="category" required
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                        <option value="Feed"           {% if stock.category == 'Feed' %}selected{% endif %}>Feed</option>
                        <option value="Medicine"       {% if stock.category == 'Medicine' %}selected{% endif %}>Medicine</option>
                        <option value="Other Supplies" {% if stock.category == 'Other Supplies' %}selected{% endif %}>Other Supplies</option>
                    </select>
                </div>

                <!-- growing house -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Growing House</label>
                    <select name="growing_house"
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                        <option value="">Select house</option>
                        <option value="Growing House 1" {% if stock.growing_house == 'Growing House 1' %}selected{% endif %}>Growing House 1</option>
                        <option value="Growing House 2" {% if stock.growing_house == 'Growing House 2' %}selected{% endif %}>Growing House 2</option>
                        <option value="General"         {% if stock.growing_house == 'General' %}selected{% endif %}>General</option>
                    </select>
                </div>

                <!-- unit -->
                <div>
                    <label class="text-xs text-muted font-bold uppercase tracking-wider block mb-1">Unit</label>
                    <select name="unit"
                            class="w-full bg-content border border-border rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue">
                        <option value="">Select unit</option>
                        <option value="kg"      {% if stock.unit == 'kg' %}selected{% endif %}>kg</option>
                        <option value="sacks"   {% if stock.unit == 'sacks' %}selected{% endif %}>sacks</option>
                        <option value="bottles" {% if stock.unit == 'bottles' %}selected{% endif %}>bottles</option>
                        <option value="pcs"     {% if stock.unit == 'pcs' %}selected{% endif %}>pcs</option>
                        <option value="liters"  {% if stock.unit == 'liters' %}selected{% endif %}>liters</option>
                        <option value="grams"   {% if stock.unit == 'grams' %}selected{% endif %}>grams</option>
                    </select>
                </div>

            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="bg-[#1A8FD1] hover:bg-[#157AB0] text-white text-sm font-bold px-6 py-2 rounded-lg transition-all">
                    Update
                </button>
                <a href="{% url 'stock_list' %}"
                   class="bg-content hover:bg-border text-muted text-sm font-bold px-6 py-2 rounded-lg transition-all border border-border">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>

{% endblock %}
